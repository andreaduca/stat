  <h1>Variance under the three normalisations</h1>
  <p class="lead">Sₙ, Sₙ/n and Sₙ/√n are one family, Sₙ/n<sup>α</sup> with α = 0, 1, ½. Their variances follow one

    Only √n keeps the spread fixed.</p>
